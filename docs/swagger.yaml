basePath: /
definitions:
  api.probeStatus:
    properties:
      status:
        type: string
    type: object
  handlers.rejectedResponse:
    properties:
      status:
        type: string
    type: object
  models.Payment:
    properties:
      amount:
        type: integer
      card_number_last_four:
        type: string
      currency:
        type: string
      expiry_month:
        type: integer
      expiry_year:
        type: integer
      id:
        type: string
      status:
        type: string
    type: object
  models.PaymentRequest:
    properties:
      amount:
        type: integer
      card_number:
        type: string
      currency:
        type: string
      cvv:
        type: string
      expiry_month:
        type: integer
      expiry_year:
        type: integer
    type: object
host: localhost:8090
info:
  contact: {}
  description: Interview challenge for building a Payment Gateway - Go version
  title: Payment Gateway Challenge Go
paths:
  /api/payments:
    post:
      consumes:
      - application/json
      description: Content-Type is not required. Unknown JSON properties are ignored.
        A 503 response has no contractual error body.
      parameters:
      - description: Payment request
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/models.PaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Payment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.rejectedResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.rejectedResponse'
        "503":
          description: Bank unavailable
      summary: Process a payment
  /api/payments/{id}:
    get:
      description: A 404 response has no contractual error body.
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Payment'
        "404":
          description: Payment not found
      summary: Retrieve a payment
  /healthz:
    get:
      description: Reports local process and router availability; it never calls the
        bank.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.probeStatus'
      summary: Gateway health probe
  /livez:
    get:
      description: Reports local process availability; it never calls the bank.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.probeStatus'
      summary: Gateway liveness probe
  /metrics:
    get:
      description: Prometheus text exposition for private production scraping only.
        It excludes /metrics from HTTP request metrics.
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Gateway Prometheus metrics
  /readyz:
    get:
      description: Reports completed local API construction only; it never calls the
        bank.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.probeStatus'
        "503":
          description: Gateway not ready
      summary: Gateway readiness probe
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
